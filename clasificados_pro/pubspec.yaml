name: clasificados_pro
description: Aplicación de clasificados hiper-local estilo "El Informador".
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Iconos y UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  # Ubicación
  geolocator: ^10.1.0
  # Imágenes
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  # Utilidades
  intl: ^0.18.1
  provider: ^6.1.1
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
